<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discordia - Download & Changelog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Efeitos de Neon Glow personalizados */
        .neon-glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.3);
        }
        .neon-glow-pink {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(236, 72, 153, 0.3);
        }
        .text-glow-cyan {
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.7);
        }
        .text-glow-pink {
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.7);
        }

        /* Animações fluidas */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-float {
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.6)); }
            50% { filter: drop-shadow(0 0 30px rgba(6, 182, 212, 0.9)); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* Splash Screen Transition */
        #splash-screen {
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
    </style>
</head>
<body class="selection:bg-pink-500 selection:text-white">

    <!-- SPLASH SCREEN DE BOAS-VINDAS -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#070913] px-4">
        <div class="relative flex flex-col items-center">
            <!-- Círculo de fundo pulsante -->
            <div class="absolute w-40 h-40 rounded-full bg-gradient-to-r from-cyan-500/20 to-pink-500/20 blur-2xl animate-pulse"></div>
            
            <!-- Logo com tamanho controlado (w-28 h-28 / max-w-[120px]) -->
            <img src="logo.png" alt="Discordia Logo" class="w-28 h-28 md:w-32 md:h-32 object-contain animate-float animate-pulse-glow relative z-10 mb-6">
            
            <h1 class="text-3xl md:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-300 to-pink-500 text-glow-cyan mb-2">
                DISCORDIA
            </h1>
            <p class="text-gray-400 text-sm md:text-base tracking-widest uppercase mb-8">Inicializando Experiência...</p>
            
            <!-- Barra de Progresso Animada -->
            <div class="w-48 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-pink-500 w-0 transition-all duration-700"></div>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO SITE -->
    <div id="main-content" class="opacity-0 transition-opacity duration-1000">
        
        <!-- HEADER / NAVBAR -->
        <header class="fixed top-0 left-0 right-0 z-40 bg-[#0b0f19]/80 backdrop-blur-md border-b border-gray-800/60">

                    <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain animate-float">
                    <span class="text-xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">
                        DISCORDIA
                    </span>
                </div>
                <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
                    <a href="#download" class="hover:text-cyan-400 transition">Download</a>
                    <a href="#changelog" class="hover:text-pink-400 transition">Changelog</a>
                    <a href="https://github.com" target="_blank" class="hover:text-white transition"><i class="fab fa-github text-lg"></i> GitHub</a>
                </nav>
                <a href="#download" class="px-5 py-2.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-cyan-500 to-pink-500 text-white shadow-lg shadow-cyan-500/20 hover:scale-105 transition transform">
                    Baixar Agora
                </a>
            </div>
        </header>
